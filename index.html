<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra historia ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8eef0;
            font-family: Georgia, serif;
            color: #4a3035;
            text-align: center;
        }

        .contenedor {
            max-width: 500px;
            padding: 40px 25px;
        }

        .corazon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        button {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #8b4a5a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="corazon">❤️</div>

        <h1>Hola, bebé</h1>

        <p>
            Hice esto pensando en ti.
        </p>

        <p>
            Hay algo que quiero recordarte...
        </p>

        <button onclick="alert('Nuestra historia apenas comienza... ❤️')">
            Abrir nuestra historia
        </button>

    </div>

</body>
</html>
